name: One-time mobile and portfolio route smoke

on:
  push:
    branches: [fix/portfolio-stability-gallery-20261027]
    paths: [.github/workflows/portfolio-mobile-smoke.yml]

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Vite application
        run: |
          npm ci
          npm run build
      - name: Install Playwright locally without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve generated build
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/fzac-portfolio-preview.log 2>&1 &)
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/proyectos >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fzac-portfolio-preview.log
          exit 1
      - name: Test portfolio and image gallery on mobile viewport
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless: true, args: ['--no-sandbox']});
          try {
            for (const pathname of ['/','/proyectos','/obra/marvel','/obra/sliders-hamburger']) {
              const page = await browser.newPage({viewport: {width: 390, height: 844}, deviceScaleFactor: 1, isMobile: true});
              const errors = []; const assetResponses = [];
              page.on('pageerror', err => errors.push(err.message));
              page.on('response', res => {
                if (res.url().includes('/assets/') && res.status() >= 400) assetResponses.push({url:res.url(), status:res.status()});
              });
              const response = await page.goto('http://127.0.0.1:4173'+pathname,{waitUntil:'networkidle',timeout:30000});
              if (!response || response.status() !== 200) throw new Error(pathname+' status '+response?.status());
              await page.waitForTimeout(1100);
              const result=await page.evaluate(() => ({
                title: document.title,
                h1: [...document.querySelectorAll('h1')].map(x=>x.textContent?.trim()).filter(Boolean),
                width: document.documentElement.scrollWidth,
                viewport:window.innerWidth,
                css:[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href)
              }));
              if(pathname==='/proyectos' && !result.h1.some(x=>x.includes('Obras comerciales y residenciales'))) throw new Error('Projects H1 missing');
              if(pathname.includes('/obra/') && !result.h1.some(x=>/Marvel|Sliders/i.test(x))) throw new Error('Project detail H1 missing');
              if(errors.length) throw new Error(pathname+' JS: '+JSON.stringify(errors));
              if(assetResponses.length) throw new Error(pathname+' 4xx CSS/images: '+JSON.stringify(assetResponses));
              if(result.width>result.viewport+8) throw new Error(pathname+' horizontal overflow '+result.width+' > '+result.viewport);
              if(!result.css.length) throw new Error(pathname+' no stylesheet loaded');
              console.log(JSON.stringify({pathname,...result,loadedCss:result.css.length}));
              await page.close();
            }
          } finally {await browser.close();}
          JS
