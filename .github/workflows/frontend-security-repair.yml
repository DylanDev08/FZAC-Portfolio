name: Frontend Security Repair

on:
  push:
    branches:
      - deps/frontend-security-20260921

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deps/frontend-security-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Repair dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit fix || true
          npm install --save-dev vite@8.3.0 @vitejs/plugin-react@latest
          npm audit fix
          npm run build
          npm audit --audit-level=high
      - name: Commit repaired lockfiles
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No dependency changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "security: actualiza dependencias vulnerables del frontend"
          git push origin HEAD:deps/frontend-security-20260921
